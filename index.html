<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Царевна Ольга</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#04001a">
    <style>
        @font-face { font-family: 'Volshebstvo'; src: url('TDVolshebstvo.otf') format('opentype'); font-weight: 400; font-style: normal; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; }
        body { background: #04001a; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; font-family: 'Times New Roman', 'Georgia', serif; padding: 12px 16px; height: 100dvh; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 35% 25%, #0a0a24 0%, #04001a 90%); z-index: -3; }
        .nebula-one { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 30%, rgba(120,100,180,0.08) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(180,160,210,0.06) 0%, transparent 50%); z-index: -2; animation: nebulaMove 50s infinite alternate; }
        .nebula-two { position: fixed; bottom: 0; right: 0; width: 100%; height: 100%; background: radial-gradient(circle at 70% 20%, rgba(160,140,200,0.05) 0%, transparent 55%), radial-gradient(circle at 30% 80%, rgba(100,80,160,0.04) 0%, transparent 55%); z-index: -2; animation: nebulaMove 60s infinite alternate-reverse; }
        @keyframes nebulaMove { 0% { opacity: 0.4; transform: scale(1); } 100% { opacity: 0.7; transform: scale(1.05); } }
        .stars-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .star { position: absolute; background: #ffe8c0; border-radius: 50%; opacity: 0; animation: starTwinkle 4s infinite ease-in-out; box-shadow: 0 0 4px #ffd080; }
        @keyframes starTwinkle { 0%,100% { opacity: 0.1; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1); } }
        .main-title { font-family: 'Volshebstvo','Times New Roman',serif; font-weight: 400; font-size: 32px; letter-spacing: 3px; background: linear-gradient(135deg,#FFD700,#FFF8DC); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 15px #FFD700); text-align: center; width: 100%; margin-bottom: 4px; }
        .princess-mirror { max-width: 360px; width: 100%; margin: 8px auto 0; display: flex; flex-direction: column; align-items: center; flex: 1; min-height: 0; justify-content: space-evenly; gap: 0; }
        .mirror-frame { position: relative; width: 70%; aspect-ratio: 1/1.15; background: radial-gradient(ellipse at 50% 45%, rgba(30,20,50,0.6) 0%, rgba(8,5,25,0.85) 90%); border-radius: 50%/40%; box-shadow: 0 0 0 4px rgba(255,215,0,0.8), 0 0 0 10px rgba(15,10,30,0.9), 0 0 0 14px rgba(255,200,0,0.6), 0 0 50px rgba(255,215,0,0.7), 0 0 80px rgba(255,180,0,0.5), inset 0 0 30px rgba(255,230,150,0.3), inset 0 0 80px rgba(0,0,0,0.8); margin-bottom: 14px; animation: gentleFloat 8s infinite ease-in-out; overflow: hidden; perspective: 1000px; }
        @keyframes gentleFloat { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-2px); } }
        .princess-face { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: inherit; z-index: 1; }
        .princess-face img { position: absolute; max-width: 98%; max-height: 98%; object-fit: contain; transition: opacity 0.18s ease; border-radius: inherit; }
        .eyes-closed { z-index: 2; opacity: 1; transition: opacity 2s ease; }
        .eyes-open { z-index: 1; opacity: 0; }
        .glasses { z-index: 3; opacity: 0; transition: opacity 2s ease; }
        @keyframes krutishka { 0% { transform: rotateY(0deg); } 65% { transform: rotateY(1800deg); } 100% { transform: rotateY(2160deg); } }
        .spin { animation: krutishka 10s linear; }
        .mirror-answer { background: rgba(5,3,20,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 40px; padding: 10px 12px; width: 100%; border: 1px solid rgba(255,215,0,0.5); box-shadow: inset 0 0 25px rgba(0,0,0,0.7), 0 0 30px rgba(255,215,0,0.3); margin-bottom: 12px; height: 80px; display: flex; align-items: center; justify-content: center; text-align: center; }
        #answer-text { color: #FFD700; font-size: 20px; font-weight: bold; text-shadow: 0 0 15px #FFD700; line-height: 1.3; transition: opacity 1.5s ease; font-style: italic; word-break: break-word; padding: 4px 0; }
        .ritual-panel { background: rgba(5,3,12,0.4); backdrop-filter: blur(5px); border: 1px solid rgba(255,215,0,0.35); border-radius: 30px; padding: 8px 10px; margin-bottom: 10px; box-shadow: 0 0 20px rgba(255,215,0,0.2); width: 100%; }
        .steps-column { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .step-row { color: #FFD700; font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; font-weight: 400; display: flex; align-items: center; justify-content: center; gap: 6px; opacity: 0.85; }
        .portal-status { color: #FFD700; font-size: 11px; min-height: 20px; letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 6px; font-weight: 400; text-shadow: 0 0 10px #FFD700; }
        .counter-text { color: #FFD700; font-size: 10px; letter-spacing: 3px; margin-top: 4px; text-transform: uppercase; text-align: center; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="nebula-one"></div>
    <div class="nebula-two"></div>
    <div class="stars-layer" id="starsLayer"></div>
    <div class="main-title">Царевна Ольга</div>
    <div class="princess-mirror">
        <div class="mirror-frame" id="mirrorFrame">
            <div class="princess-face">
                <img src="images/closed.png" class="eyes-closed" alt="Царевна слушает" loading="eager">
                <img src="images/open.png" class="eyes-open" alt="Царевна" loading="eager">
                <img src="images/glasses.png" class="glasses" alt="Царевна знает" loading="eager">
            </div>
        </div>
        <div class="mirror-answer"><div id="answer-text"></div></div>
        <div class="ritual-panel">
            <div class="steps-column">
                <div class="step-row"><span>ЗАГАДАЙ ЖЕЛАНИЕ</span></div>
                <div class="step-row"><span>ВСТРЕТЬСЯ ВЗГЛЯДОМ</span></div>
                <div class="step-row"><span>ПРИЛОЖИ ТАЛИСМАН</span></div>
            </div>
        </div>
        <div class="portal-status" id="portalStatus">Царевна ждёт...</div>
        <div class="counter-text"><span id="counterDisplay">0</span> <span id="counterLabel">предсказаний</span></div>
    </div>
    <script src="oracle.js"></script>
</body>
</html>
